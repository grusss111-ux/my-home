        function addFoodLogEntry(entry) {
            macroProfile.todayDate = getTodayISO();
            if (!Array.isArray(macroProfile.foodLog)) macroProfile.foodLog = [];
            const item = {
                id: 'log_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                title: entry.title,
                kcal: Math.round(entry.kcal || 0),
                p: Math.round((entry.p || 0) * 10) / 10,
                f: Math.round((entry.f || 0) * 10) / 10,
                c: Math.round((entry.c || 0) * 10) / 10
            };
            macroProfile.foodLog.unshift(item);
            macroProfile.eaten.kcal = Math.round(macroProfile.eaten.kcal + item.kcal);
            macroProfile.eaten.p = Math.round((macroProfile.eaten.p + item.p) * 10) / 10;
            macroProfile.eaten.f = Math.round((macroProfile.eaten.f + item.f) * 10) / 10;
            macroProfile.eaten.c = Math.round((macroProfile.eaten.c + item.c) * 10) / 10;
        }

        function removeFoodLogEntry(logId) {
            if (!Array.isArray(macroProfile.foodLog)) return;
            const idx = macroProfile.foodLog.findIndex(x => x.id === logId);
            if (idx === -1) return;
            const item = macroProfile.foodLog[idx];
            macroProfile.eaten.kcal = Math.max(0, Math.round(macroProfile.eaten.kcal - item.kcal));
            macroProfile.eaten.p = Math.max(0, Math.round((macroProfile.eaten.p - item.p) * 10) / 10);
            macroProfile.eaten.f = Math.max(0, Math.round((macroProfile.eaten.f - item.f) * 10) / 10);
            macroProfile.eaten.c = Math.max(0, Math.round((macroProfile.eaten.c - item.c) * 10) / 10);
            macroProfile.foodLog.splice(idx, 1);
            saveState();
            renderMacrosWidget();
            showToast('Запись удалена из дневника');
        }

        function getAllMacroFoodItems() {
            const homeFoods = products
                .filter(p => p.macros && (p.macros.kcal > 0 || p.macros.p > 0 || p.macros.f > 0 || p.macros.c > 0))
                .map(p => ({
                    id: p.id,
                    name: p.name,
                    unit: p.unit,
                    qty: p.qty,
                    inHome: true,
                    macros: p.macros
                }));

            const extraFoods = EXTRA_FOOD_DATABASE
                .filter(e => !homeFoods.some(h => h.name.toLowerCase() === e.name.toLowerCase()))
                .map(e => ({
                    id: e.id,
                    name: e.name,
                    unit: e.unit,
                    qty: null,
                    inHome: false,
                    macros: e.macros
                }));

            return [...homeFoods, ...extraFoods];
        }

        function filterFoodDbList() {
            const q = (document.getElementById('foodDbSearch').value || '').trim().toLowerCase();
            const allItems = getAllMacroFoodItems();
            const filtered = q ? allItems.filter(i => i.name.toLowerCase().includes(q)) : allItems.slice(0, 12);

            const listEl = document.getElementById('foodDbResults');
            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center text-xs text-olive-700/70 py-3">Ничего не найдено. Переключитесь на «Вручную» или добавьте товар через «+ Добавить».</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(item => {
                const isPiece = item.unit === 'шт' || item.unit === 'банка';
                const perLabel = isPiece ? `1 ${item.unit}` : `100 ${item.unit}`;
                const stockBadge = item.inHome
                    ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-olive-700/10 text-olive-800">Дома: ${item.qty} ${item.unit}</span>`
                    : `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-cream-200 text-olive-700">Справочник</span>`;

                return `
                    <button type="button" onclick="selectDbFoodItem('${item.id}')"
                        class="w-full text-left bg-white hover:bg-cream-100 border border-cream-200 rounded-xl p-2.5 flex items-center justify-between gap-2 transition">
                        <div class="min-w-0">
                            <div class="font-bold text-xs text-olive-900 truncate">${item.name}</div>
                            <div class="text-[11px] text-olive-700/75">На ${perLabel}: ${item.macros.kcal} ккал (Б:${item.macros.p} Ж:${item.macros.f} У:${item.macros.c})</div>
                        </div>
                        <div class="shrink-0">${stockBadge}</div>
                    </button>
                `;
            }).join('');
        }

        function selectDbFoodItem(itemId) {
            const allItems = getAllMacroFoodItems();
            const item = allItems.find(i => i.id === itemId);
            if (!item) return;

            selectedDbFoodItem = item;
            const isPiece = item.unit === 'шт' || item.unit === 'банка';
            const perLabel = isPiece ? `1 ${item.unit}` : `100 ${item.unit}`;

            document.getElementById('selDbFoodName').textContent = item.name;
            document.getElementById('selDbFoodBaseInfo').textContent = `На ${perLabel}: ${item.macros.kcal} ккал • Б:${item.macros.p} Ж:${item.macros.f} У:${item.macros.c}`;

            document.getElementById('selDbAmount').value = isPiece ? 1 : 100;

            document.getElementById('selectedDbFoodCard').classList.remove('hidden');

        function recalcSelectedDbFood() {
            if (!selectedDbFoodItem) return;
            const amount = Math.max(0, parseFloat(document.getElementById('selDbAmount').value) || 0);
            const isPiece = selectedDbFoodItem.unit === 'шт' || selectedDbFoodItem.unit === 'банка';
            const factor = isPiece ? amount : (amount / 100);

            const kcal = Math.round(selectedDbFoodItem.macros.kcal * factor);
            const p = Math.round(selectedDbFoodItem.macros.p * factor * 10) / 10;
            const f = Math.round(selectedDbFoodItem.macros.f * factor * 10) / 10;
            const c = Math.round(selectedDbFoodItem.macros.c * factor * 10) / 10;

            document.getElementById('selDbCalcKcal').textContent = `${kcal} ккал`;
            document.getElementById('selDbCalcBju').textContent = `Б: ${p} • Ж: ${f} • У: ${c}`;
        }

                if (amount <= 0) {

                const isPiece = selectedDbFoodItem.unit === 'шт' || selectedDbFoodItem.unit === 'банка';
                const factor = isPiece ? amount : (amount / 100);

                const kcal = Math.round(selectedDbFoodItem.macros.kcal * factor);
                const p = Math.round(selectedDbFoodItem.macros.p * factor * 10) / 10;
                const f = Math.round(selectedDbFoodItem.macros.f * factor * 10) / 10;
                const c = Math.round(selectedDbFoodItem.macros.c * factor * 10) / 10;

                addFoodLogEntry({
                    title: `${selectedDbFoodItem.name} (${amount} ${selectedDbFoodItem.unit})`,

                saveState();

                renderAll();

                showToast(`+${kcal} ккал (Б: ${p} г) записано${deductedMsg}!`);

                const kcal = Math.max(0, parseFloat(document.getElementById('qmKcal').value) || 0);
                const p = Math.max(0, parseFloat(document.getElementById('qmProt').value) || 0);
                const f = Math.max(0, parseFloat(document.getElementById('qmFat').value) || 0);
                const c = Math.max(0, parseFloat(document.getElementById('qmCarb').value) || 0);

                if (kcal === 0 && p === 0 && f === 0 && c === 0) {

                addFoodLogEntry({ title: name, kcal, p, f, c });
                saveState();
                renderMacrosWidget();
                closeQuickMacroModal();
                showToast(`+${Math.round(kcal)} ккал записано в дневник!`);

        async function autoFillProductMacros() {
            const name = document.getElementById('newProdName').value.trim();
            const unit = document.getElementById('newProdUnit').value;
            if (!name) {
                showToast('Сначала введите название продукта', true);
                return;
            }
            const btn = document.getElementById('autoMacroBtn');
            const origHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="ph-bold ph-spinner animate-spin"></i> Ищу...`;

            try {
                const isPiece = unit === 'шт' || unit === 'банка';
                const perText = isPiece ? `на 1 ${unit}` : `на 100 ${unit}`;
                const prompt = `Дай реальные справочные значения КБЖУ для продукта "${name}" строго ${perText}. Верни ТОЛЬКО JSON: {"kcal": число, "p": число, "f": число, "c": число}. Если это несъедобный товар (шампунь, пакеты), верни нули.`;

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${userGeminiApiKey || ''}`;
                const resp = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: 'application/json' }
                    })
                });
                const data = await resp.json();
                const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
                const parsed = JSON.parse(rawText);

                document.getElementById('newProdKcal').value = parsed.kcal ?? 0;
                document.getElementById('newProdProt').value = parsed.p ?? 0;
                document.getElementById('newProdFat').value = parsed.f ?? 0;
                document.getElementById('newProdCarb').value = parsed.c ?? 0;
                showToast(`КБЖУ ${perText} найдено! Проверьте при желании по этикетке.`);
            } catch (e) {
                showToast('Не удалось автозаполнить — введите цифры с упаковки вручную', true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = origHtml;
            }
        }
